# Render Blueprint — API + free Postgres. PERSISTENCE=prisma switches the
# in-memory repositories for Prisma without touching application code.
# Deploy: https://render.com/deploy?repo=https://github.com/josuejcalazans/nestjs-multitenant-starter
databases:
  - name: multitenant-starter-db
    plan: free
    databaseName: starter
    user: starter

services:
  - type: web
    name: nestjs-multitenant-starter
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PERSISTENCE
        value: prisma
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: multitenant-starter-db
          property: connectionString
